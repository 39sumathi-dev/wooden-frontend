<nav class="navbar"
     [class.scrolled]="isScrolled() || megaMenuOpen()"
     [class.nav-open]="mobileOpen()"
     (mouseleave)="closeMegaMenu()"
     role="navigation"
     aria-label="Main navigation">

  <!-- Inner layout -->
  <div class="nav-inner container">

    <!-- Logo -->
    <a routerLink="/" class="nav-logo" (click)="closeMobile()" aria-label="SK Wood Turnery — Home">
      <img src="assets/logo/logo.jpg"
           alt="SK Wood Turnery Logo"
           class="nav-logo-badge"
           width="58"
           height="48">
      <span class="nav-logo-text">
        <span class="brand-title">SK Wood Turnery</span>
        <span class="brand-sub">Handcrafted · Timeless · Quality</span>
      </span>
    </a>

    <!-- Desktop nav links — Centered -->
    <ul class="nav-links" role="list">
      <li class="nav-item">
        <a class="nav-link"
           routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="closeMegaMenu()">
          Home
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link"
           routerLink="/shop"
           routerLinkActive="active"
           (click)="closeMegaMenu()">
          Products
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link"
           routerLink="/about"
           routerLinkActive="active"
           (click)="closeMegaMenu()">
          About
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link"
           routerLink="/contact"
           routerLinkActive="active"
           (click)="closeMegaMenu()">
          Contact
        </a>
      </li>
    </ul>

    <!-- Right actions -->
    <div class="nav-actions">
      <!-- Search button -->
      <a routerLink="/shop" class="nav-icon-btn" aria-label="Search collection" title="Search">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </a>

      <!-- Wishlist / Heart button -->
      <button class="nav-icon-btn hide-mobile" aria-label="Wishlist" title="Saved items">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>

      <!-- User account button -->
      <button class="nav-icon-btn hide-mobile" aria-label="Account" title="Account">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>

      <!-- Cart button -->
      <button class="nav-icon-btn cart-btn"
              id="nav-cart-btn"
              aria-label="Open shopping cart"
              (click)="cart.openCart()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-count" [attr.aria-label]="cart.count() + ' items in cart'">{{ cart.count() }}</span>
      </button>

      <!-- Mobile hamburger -->
      <button class="hamburger"
              id="nav-menu-btn"
              [class.is-open]="mobileOpen()"
              aria-label="Toggle mobile menu"
              [attr.aria-expanded]="mobileOpen()"
              (click)="toggleMobile()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- ── MOBILE NAVIGATION DRAWER ────────────────────────────────────── -->
  <div class="mobile-drawer" [class.is-open]="mobileOpen()" role="dialog" aria-label="Mobile navigation">
    <div class="mobile-drawer-inner">
      <div class="mobile-nav-header">
        <span class="type-label text-muted">SK Wood Turnery</span>
        <button class="mobile-close-btn" (click)="closeMobile()" aria-label="Close menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <ul class="mobile-menu-list" role="list">
        <li>
          <a class="mobile-nav-item" routerLink="/" (click)="closeMobile()">Home</a>
        </li>
        <li>
          <a class="mobile-nav-item" routerLink="/shop" (click)="closeMobile()">Products</a>
        </li>
        <li>
          <a class="mobile-nav-item" routerLink="/about" (click)="closeMobile()">About</a>
        </li>
        <li>
          <a class="mobile-nav-item" routerLink="/contact" (click)="closeMobile()">Contact</a>
        </li>
      </ul>

      <div class="mobile-drawer-footer">
        <button class="btn btn-oak mobile-cart-btn"
                (click)="cart.openCart(); closeMobile()">
          <span>View Cart ({{ cart.count() }})</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile & Mega-menu overlays -->
  @if (mobileOpen()) {
    <div class="mobile-overlay" (click)="closeMobile()" aria-hidden="true"></div>
  }
  @if (megaMenuOpen()) {
    <div class="mega-overlay" (click)="closeMegaMenu()" aria-hidden="true"></div>
  }
</nav>
